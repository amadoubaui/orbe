# TEMPORAIRE (branche essais-fiables) : répète les tests de bout en bout pour
# mesurer les échecs intermittents. À retirer avant la fusion.
name: Essais répétés

on:
  push:
    branches: [essais-fiables]
  workflow_dispatch:

jobs:
  repete:
    name: ${{ matrix.os }} n° ${{ matrix.lot }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        lot: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - { os: macos-latest, lot: 6 }
          - { os: macos-latest, lot: 7 }
          - { os: macos-latest, lot: 8 }
    env:
      ORBE_DIAG_SYMBOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Écran en 1920 × 1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Format-List FullName
      - name: Dossier des captures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          echo "ORBE_SHOTS=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"
      - name: Vol d'une vue (expérience, lot 1)
        if: matrix.lot == 1
        continue-on-error: true
        shell: bash
        run: |
          node -e "require('./scripts/dev.js').ensure()"
          node "$HOME/.orbe-dev/node_modules/electron/cli.js" tests/tmp-vol.js
      - name: Tests de bout en bout, quatre passages
        shell: bash
        run: |
          set +e
          echecs=0
          for i in 1 2 3 4; do
            journal="$RUNNER_TEMP/captures/passage-${{ matrix.lot }}-$i.log"
            node scripts/dev.js --selftest > "$journal" 2>&1
            code=$?
            echo "=== passage $i : code $code"
            grep -E "✗|ÉCHEC|milieu de|animation native|trajet d|clic\(s\) perdu|ignoré :|vérifications réussies" "$journal" | cut -c1-400
            if [ "$code" != "0" ]; then echecs=$((echecs + 1)); echo "--- journal entier"; cat "$journal"; fi
          done
          echo "=== $echecs échec(s) sur 4"
          exit $echecs
      - name: Extensions dans le navigateur (lot 1)
        if: always() && matrix.lot == 1
        run: node scripts/test-ext.js
      - name: Journaux et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repete-${{ matrix.os }}-${{ matrix.lot }}
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
