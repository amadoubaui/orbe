<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Boost</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<style>
html, body { background: transparent; overflow: hidden; }
body { background: color-mix(in srgb, var(--base) 86%, transparent); display: flex; flex-direction: column; height: 100vh; }
#drag { height: 38px; -webkit-app-region: drag; flex: none; }
main { padding: 0 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; max-width: none; margin: 0; }
h1 { font-size: 16px; margin: 0; }
textarea { flex: 1; min-height: 120px; resize: none; border: 0; outline: 0; border-radius: 10px; background: var(--pill); color: var(--fg); padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; user-select: text; }
#zaps { display: flex; flex-direction: column; gap: 4px; max-height: 110px; overflow: auto; }
.zap { display: flex; gap: 8px; align-items: center; font: 11px ui-monospace, Menlo, monospace; color: var(--dim); }
.zap span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowb { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div id="drag"></div>
<main>
  <div class="rowb"><h1 id="host" style="flex:1"></h1><label class="rowb"><input type="checkbox" id="on"><span data-t="boost.enabled"></span></label></div>
  <textarea id="css" spellcheck="false" data-t-ph="boost.placeholder"></textarea>
  <div id="zaps"></div>
  <div class="rowb"><button class="btn primary" id="zap" data-t="boost.zap"></button><span class="muted" style="font-size:12px" data-t="boost.zapHint"></span></div>
</main>
<script src="common.js"></script>
<script src="boost.js"></script>
</body>
</html>
