<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'">
<title>Notes</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<style>
html, body { overflow: hidden; }
body { display: flex; height: 100vh; }
#list { width: 240px; flex: none; overflow: auto; padding: 14px 8px; border-right: 0.5px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
#new { margin: 0 4px 10px; height: 32px; }
.note { padding: 8px 10px; border-radius: 9px; }
.note:hover { background: var(--hover); }
.note.on { background: var(--pill); }
.note b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.note span { color: var(--dim); font-size: 11.5px; }
#pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#bar { height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 16px; flex: none; color: var(--dim); font-size: 12px; }
#editor { flex: 1; overflow: auto; outline: 0; padding: 10px 9% 60px; font-size: 16px; line-height: 1.6; user-select: text; cursor: text; }
#editor:empty::before { content: attr(data-ph); color: var(--faint); }
#editor h1, #editor div:first-child { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
#none { margin: auto; color: var(--dim); }
</style>
</head>
<body>
<div id="list"><button class="btn primary" id="new" data-t="notes.new"></button><div id="items"></div></div>
<div id="pane">
  <div id="bar"><span id="saved"></span><button class="btn" id="del" data-t="set.profileDelete"></button></div>
  <div id="editor" contenteditable="plaintext-only" spellcheck="true"></div>
</div>
<script src="common.js"></script>
<script src="notes.js"></script>
</body>
</html>
